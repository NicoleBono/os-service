name: CI/CD - OS Service

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: os-service
  REGISTRY: ghcr.io/nicolebono

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: os_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes unitários (cobertura ≥80%)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/os_test
          JWT_SECRET: test-secret
        run: npm run test:coverage

      - name: Rodar testes BDD
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/os_test
          JWT_SECRET: test-secret
        run: npm run test:bdd

      - name: SonarCloud Scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Build e Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homolog'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadata da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-homolog:
    name: Deploy Homologação
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/homolog'
    environment: homolog

    steps:
      - uses: actions/checkout@v4

      - name: Configurar kubectl
        uses: azure/setup-kubectl@v3

      - name: Configurar kubeconfig
        run: echo "${{ secrets.KUBECONFIG_HOMOLOG }}" | base64 -d > kubeconfig.yaml

      - name: Deploy no K8s (homolog)
        env:
          KUBECONFIG: kubeconfig.yaml
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          kubectl set image deployment/os-service \
            os-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG::7} \
            -n oficina
          kubectl rollout status deployment/os-service -n oficina

  deploy-prod:
    name: Deploy Produção
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configurar kubectl
        uses: azure/setup-kubectl@v3

      - name: Configurar kubeconfig
        run: echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > kubeconfig.yaml

      - name: Deploy no K8s (prod)
        env:
          KUBECONFIG: kubeconfig.yaml
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          kubectl set image deployment/os-service \
            os-service=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG::7} \
            -n oficina
          kubectl rollout status deployment/os-service -n oficina
